name: Python conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Biosigpy
        uses: actions/checkout@v4
        with:
          path: biosigpy

      - name: Read Biosiglib pin
        id: biosiglib-pin
        working-directory: biosigpy
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("conformance.json").read_text(encoding="utf-8"))
          commit = manifest["biosiglib"]["commit"]
          release = manifest["biosiglib"].get("release", "")
          print(f"commit={commit}")
          print(f"release={release}")
          PY

      - name: Check out pinned Biosiglib
        uses: actions/checkout@v4
        with:
          repository: BSICoS/biosiglib
          ref: ${{ steps.biosiglib-pin.outputs.commit }}
          path: biosiglib
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: biosigpy/pyproject.toml

      - name: Install development dependencies
        working-directory: biosigpy
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        working-directory: biosigpy
        env:
          BIOSIGLIB_ROOT: ${{ github.workspace }}/biosiglib
        run: python -m pytest

      - name: Validate conformance manifest
        working-directory: biosigpy
        run: python ../biosiglib/tools/validate_specs.py --manifest conformance.json

  compatibility:
    name: compatibility (${{ matrix.python-version }}, ${{ matrix.dependency-set }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            dependency-set: minimum
          - python-version: "3.10"
            dependency-set: latest
          - python-version: "3.11"
            dependency-set: latest
          - python-version: "3.13"
            dependency-set: latest
    steps:
      - name: Check out Biosigpy
        uses: actions/checkout@v4
        with:
          path: biosigpy

      - name: Read Biosiglib pin
        id: biosiglib-pin
        working-directory: biosigpy
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("conformance.json").read_text(encoding="utf-8"))
          print(f"commit={manifest['biosiglib']['commit']}")
          PY

      - name: Check out pinned Biosiglib
        uses: actions/checkout@v4
        with:
          repository: BSICoS/biosiglib
          ref: ${{ steps.biosiglib-pin.outputs.commit }}
          path: biosiglib
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: biosigpy/pyproject.toml

      - name: Install tested dependency set
        working-directory: biosigpy
        env:
          DEPENDENCY_SET: ${{ matrix.dependency-set }}
        run: |
          python -m pip install --upgrade pip
          if [[ "$DEPENDENCY_SET" == "minimum" ]]; then
            python -m pip install numpy==1.26.4 scipy==1.11.4
          fi
          python -m pip install -e ".[dev]"
          python -c "import numpy, scipy; print(f'NumPy {numpy.__version__}; SciPy {scipy.__version__}')"

      - name: Run pytest
        working-directory: biosigpy
        env:
          BIOSIGLIB_ROOT: ${{ github.workspace }}/biosiglib
        run: python -m pytest

      - name: Validate conformance manifest
        working-directory: biosigpy
        run: python ../biosiglib/tools/validate_specs.py --manifest conformance.json
