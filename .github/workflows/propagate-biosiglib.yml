name: Update Biosiglib Pin

on:
  workflow_dispatch:
    inputs:
      biosiglib_commit:
        description: "Biosiglib commit SHA"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  propagate:
    runs-on: ubuntu-latest
    env:
      BIOSIGLIB_COMMIT: ${{ inputs.biosiglib_commit }}
      BIOSIGLIB_ROOT: ${{ github.workspace }}/biosiglib

    steps:
      - name: Validate propagation inputs
        id: propagation-inputs
        shell: bash
        run: |
          if [[ ! "$BIOSIGLIB_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Biosiglib commit must be a 40-character SHA: $BIOSIGLIB_COMMIT" >&2
            exit 1
          fi
          normalized_commit="$(echo "$BIOSIGLIB_COMMIT" | tr '[:upper:]' '[:lower:]')"
          echo "BIOSIGLIB_COMMIT=$normalized_commit" >> "$GITHUB_ENV"
          echo "biosiglib_commit=$normalized_commit" >> "$GITHUB_OUTPUT"
          echo "biosiglib_short_commit=${normalized_commit:0:12}" >> "$GITHUB_OUTPUT"

      - name: Check out Biosigpy
        uses: actions/checkout@v7
        with:
          path: biosigpy

      - name: Check out Biosiglib
        uses: actions/checkout@v7
        with:
          repository: BSICoS/biosiglib
          ref: ${{ steps.propagation-inputs.outputs.biosiglib_commit }}
          path: biosiglib
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Biosiglib commit
        shell: bash
        run: |
          actual_commit="$(git -C biosiglib rev-parse HEAD | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual_commit" != "$BIOSIGLIB_COMMIT" ]]; then
            echo "Biosiglib checkout mismatch: expected $BIOSIGLIB_COMMIT, got $actual_commit" >&2
            exit 1
          fi

      - name: Update Biosiglib lock
        id: lock-update
        working-directory: biosigpy
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path("biosiglib.lock")
          commit = os.environ["BIOSIGLIB_COMMIT"].lower()
          path.write_text(commit + "\n", encoding="utf-8")
          PY
          git diff -- biosiglib.lock

      - name: Detect lock change
        id: lock-change
        working-directory: biosigpy
        shell: bash
        run: |
          if git diff --quiet -- biosiglib.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "biosiglib.lock already pins $BIOSIGLIB_COMMIT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: biosigpy/requirements-dev.txt

      - name: Install development dependencies
        working-directory: biosigpy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run full Python test suite
        working-directory: biosigpy
        run: python -m pytest

      - name: Check whitespace
        working-directory: biosigpy
        run: git diff --check

      - name: Open propagation pull request
        if: steps.lock-change.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          path: biosigpy
          add-paths: biosiglib.lock
          commit-message: Pin Biosiglib ${{ steps.propagation-inputs.outputs.biosiglib_short_commit }}
          branch: chore/biosiglib-${{ steps.propagation-inputs.outputs.biosiglib_short_commit }}
          delete-branch: true
          base: main
          title: Pin Biosiglib ${{ steps.propagation-inputs.outputs.biosiglib_short_commit }}
          body: |
            Updates the Biosiglib conformance pin used by Biosigpy.

            - Biosiglib commit: `${{ steps.propagation-inputs.outputs.biosiglib_commit }}`
            - Merged code must conform to every specification in that commit.
            - Conformance is verified by this workflow run and the pull request checks.
            - Shared fixtures and conformance cases were consumed from Biosiglib and were not copied into Biosigpy.
