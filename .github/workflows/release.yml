name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install release validation tooling
        run: python -m pip install "cffconvert>=2.0,<3"

      - name: Validate citation metadata, tag, and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cffconvert --validate
          python - <<'PY'
          import os
          import re
          import runpy
          from pathlib import Path

          from ruamel.yaml import YAML

          version = runpy.run_path("src/biosigpy/_version.py")["__version__"]
          if re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-beta)?", version) is None:
              raise SystemExit(f"Expected X.Y.Z or X.Y.Z-beta, got {version!r}")
          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]
          if actual_tag != expected_tag:
              raise SystemExit(f"Tag {actual_tag!r} does not match {expected_tag!r}")

          citation = YAML(typ="safe").load(
              Path("CITATION.cff").read_text(encoding="utf-8")
          )
          citation_version = str(citation["version"])
          if citation_version != version:
              raise SystemExit(
                  f"CITATION.cff version {citation_version!r} does not match {version!r}"
              )

          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = re.compile(
              rf"^## {re.escape(version)} - (\d{{4}}-\d{{2}}-\d{{2}})\s*$",
              re.MULTILINE,
          )
          match = heading.search(changelog)
          if match is None:
              raise SystemExit(f"CHANGELOG.md has no dated section for {version}")
          release_date = citation["date-released"]
          release_date = getattr(release_date, "isoformat", lambda: str(release_date))()
          if release_date != match.group(1):
              raise SystemExit(
                  "CITATION.cff date-released does not match CHANGELOG.md: "
                  f"{release_date!r} != {match.group(1)!r}"
              )
          next_heading = re.search(r"^## ", changelog[match.end():], re.MULTILINE)
          end = match.end() + next_heading.start() if next_heading else len(changelog)
          Path("release-notes.md").write_text(
              changelog[match.start():end].strip() + "\n", encoding="utf-8"
          )
          PY

      - name: Read Biosiglib pin
        id: biosiglib-pin
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          raw_lock = Path("biosiglib.lock").read_text(encoding="utf-8")
          if re.fullmatch(r"[0-9a-f]{40}\n?", raw_lock) is None:
              raise SystemExit("biosiglib.lock must contain one lowercase 40-character SHA")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"commit={raw_lock.strip()}", file=output)
          PY

      - name: Check out pinned Biosiglib
        uses: actions/checkout@v7
        with:
          repository: BSICoS/biosiglib
          ref: ${{ steps.biosiglib-pin.outputs.commit }}
          path: .release-biosiglib
          persist-credentials: false

      - name: Run full Python suite against pinned Biosiglib
        env:
          BIOSIGLIB_ROOT: ${{ github.workspace }}/.release-biosiglib
        run: |
          python -m pip install -e ".[dev]"
          python -m pytest

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2,<2"
          python -m build

      - name: Verify source distribution contents
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path

          archives = list(Path("dist").glob("*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"Expected one source distribution, found {archives}")
          version = archives[0].name.removeprefix("biosigpy-").removesuffix(".tar.gz")
          with tarfile.open(archives[0], "r:gz") as archive:
              members = {Path(name).as_posix() for name in archive.getnames()}
          suffixes = {
              "biosiglib.lock",
              "CHANGELOG.md",
              "CITATION.cff",
              "tests/conftest.py",
              "tests/conformance.py",
          }
          missing = [suffix for suffix in suffixes if not any(name.endswith(suffix) for name in members)]
          if missing:
              raise SystemExit(f"Source distribution is missing: {missing}")
          PY

      - name: Smoke-test wheel in a clean environment
        run: |
          python -m venv .release-wheel
          .release-wheel/bin/python -m pip install --upgrade pip
          .release-wheel/bin/python -m pip install dist/*.whl
          .release-wheel/bin/python -c "from importlib.metadata import version; import biosigpy; assert version('biosigpy') == biosigpy.__version__.replace('-beta', 'b0'); assert callable(biosigpy.removefp); assert callable(biosigpy.fillgaps); assert callable(biosigpy.sloperange)"

      - name: Smoke-test source distribution in a clean environment
        run: |
          python -m venv .release-sdist
          .release-sdist/bin/python -m pip install --upgrade pip
          .release-sdist/bin/python -m pip install dist/*.tar.gz
          .release-sdist/bin/python -c "from importlib.metadata import version; import biosigpy; assert version('biosigpy') == biosigpy.__version__.replace('-beta', 'b0'); assert callable(biosigpy.removefp); assert callable(biosigpy.fillgaps); assert callable(biosigpy.tdmetrics)"

      - name: Record artifact checksums
        run: |
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Prepare GitHub release metadata
        run: |
          mkdir release-metadata
          cp dist/SHA256SUMS release-metadata/
          cp release-notes.md release-metadata/

      - name: Upload verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub release metadata
        uses: actions/upload-artifact@v7
        with:
          name: github-release-metadata
          path: release-metadata/
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist

      - name: Download release metadata
        uses: actions/download-artifact@v8
        with:
          name: github-release-metadata
          path: release-metadata

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-beta ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* release-metadata/SHA256SUMS \
            --verify-tag --title "Biosigpy $GITHUB_REF_NAME" \
            --notes-file "release-metadata/release-notes.md" "${release_flags[@]}"

  pypi-publish:
    name: Publish PyPI release
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/biosigpy
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
