[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "biosigpy"
dynamic = ["version"]
description = "Python implementation of the Biosiglib specifications for biomedical signal processing."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.11.4",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Documentation = "https://bsicos.github.io/biosigpy/"
Issues = "https://github.com/BSICoS/biosigpy/issues"
Repository = "https://github.com/BSICoS/biosigpy"

[project.optional-dependencies]
examples = [
    "matplotlib",
    "PyQt6",
]
dev = [
    "build>=1.2,<2",
    "jsonschema",
    "matplotlib",
    "pytest",
]
docs = [
    "mkdocs-material<9.7.0",
    "mkdocs-awesome-pages-plugin",
    "mkdocs-minify-plugin",
    "mkdocs-redirects<1.2.3",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocstrings[python]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "biosigpy._version.__version__"}
